<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Shadow / base glow -->
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8" />
      <stop offset="50%" stop-color="#FFC94A" />
      <stop offset="100%" stop-color="#E8A317" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Crown body -->
  <g filter="url(#softShadow)">
    <!-- Band + spikes -->
    <path d="M10 55 L10 40 L20 20 L30 40 L50 10 L70 40 L80 20 L90 40 L90 55 Z"
          fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5" />
    <!-- Band highlight -->
    <rect x="10" y="40" width="80" height="15" fill="rgba(255,255,255,0.2)" />
  </g>

  <!-- Central large gem -->
  <circle cx="50" cy="10" r="6" fill="#3A86FF" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
  <!-- Side gems -->
  <circle cx="20" cy="20" r="4" fill="#E63946" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
  <circle cx="80" cy="20" r="4" fill="#E63946" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
  <circle cx="30" cy="40" r="3.5" fill="#2A9D8F" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
  <circle cx="70" cy="40" r="3.5" fill="#2A9D8F" stroke="rgba(0,0,0,0.3)" stroke-width="1" />

  <!-- Small band gems -->
  <circle cx="25" cy="47" r="2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="40" cy="47" r="2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="60" cy="47" r="2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="75" cy="47" r="2" fill="#FFFFFF" opacity="0.9" />
</svg>