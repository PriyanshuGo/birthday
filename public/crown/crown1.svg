<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"></stop>
      <stop offset="40%" stop-color="#FFD54F"></stop>
      <stop offset="75%" stop-color="#F9A825"></stop>
      <stop offset="100%" stop-color="#F57F17"></stop>
    </linearGradient>

    <linearGradient id="gold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"></stop>
      <stop offset="100%" stop-color="#FFB300"></stop>
    </linearGradient>
  </defs>

  <!-- Sun Ring -->
  <g fill="url(#gold)" stroke="#8D5A00" stroke-width="4">
    <circle cx="256" cy="180" r="150" fill="none"></circle>

    <!-- Rays -->
    <g transform="translate(256 180)">
      <polygon points="0,-185 -12,-155 12,-155"></polygon>
      <polygon points="131,-131 110,-110 145,-105"></polygon>
      <polygon points="185,0 155,-12 155,12"></polygon>
      <polygon points="131,131 105,145 110,110"></polygon>
      <polygon points="0,185 -12,155 12,155"></polygon>
      <polygon points="-131,131 -110,110 -145,105"></polygon>
      <polygon points="-185,0 -155,-12 -155,12"></polygon>
      <polygon points="-131,-131 -105,-145 -110,-110"></polygon>
    </g>
  </g>

  <!-- Dome -->
  <path d="M130 410
       Q125 210 256 130
       Q387 210 382 410
       Z" fill="url(#gold)" stroke="#8D5A00" stroke-width="4"></path>

  <!-- Dome Lines -->
  <g stroke="#B26A00" stroke-width="3" fill="none">
    <path d="M256 140 L256 395"></path>
    <path d="M205 165 Q190 260 195 390"></path>
    <path d="M307 165 Q322 260 317 390"></path>
    <path d="M165 215 Q155 300 160 400"></path>
    <path d="M347 215 Q357 300 352 400"></path>
  </g>

  <!-- Top Ornament -->
  <g fill="url(#gold2)" stroke="#8D5A00" stroke-width="4">
    <ellipse cx="256" cy="92" rx="22" ry="16"></ellipse>
    <path d="M256 20
             L282 70
             Q256 58 230 70
             Z"></path>
    <rect x="240" y="92" width="32" height="22" rx="8"></rect>
  </g>

  <!-- Center Jewel -->
  <g stroke="#8D5A00" stroke-width="4">
    <path d="M256 220
         L296 270
         L256 320
         L216 270
         Z" fill="url(#gold2)"></path>
    <ellipse cx="256" cy="270" rx="14" ry="34" fill="#FFF176"></ellipse>
  </g>

  <!-- Decorative Band -->
  <path d="M155 355
       Q256 295 357 355" fill="none" stroke="#8D5A00" stroke-width="10"></path>

  <g fill="url(#gold2)" stroke="#8D5A00" stroke-width="3">
    <path d="M175 355 q10-30 20 0z"></path>
    <path d="M215 340 q10-30 20 0z"></path>
    <path d="M255 335 q10-30 20 0z"></path>
    <path d="M295 340 q10-30 20 0z"></path>
    <path d="M335 355 q10-30 20 0z"></path>
  </g>

  <!-- Bottom Rim -->
  <path d="M135 405
       Q256 350 377 405" fill="none" stroke="#8D5A00" stroke-width="12"></path>

  <!-- Highlights -->
  <path d="M210 165
       Q175 250 182 380" stroke="#FFF59D" stroke-width="8" fill="none" opacity=".7"></path>

</svg>